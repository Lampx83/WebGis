services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webgis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webgis}
      POSTGRES_DB: ${POSTGRES_DB:-webgis}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Schema files run automatically (in filename order) on FIRST init only.
      - ./scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webgis} -d ${POSTGRES_DB:-webgis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webgis

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-webgis}:${POSTGRES_PASSWORD:-webgis}@db:5432/${POSTGRES_DB:-webgis}
      # Required: the app refuses to start without a random secret (>= 32 chars).
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a random string of at least 32 characters (openssl rand -base64 48)}
      # Shared key IoT gateways send as `x-api-key` when posting readings/detections.
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      ZALO_ACCESS_TOKEN: ${ZALO_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8043}:3000"
    networks:
      - webgis

volumes:
  db_data:

networks:
  webgis:
